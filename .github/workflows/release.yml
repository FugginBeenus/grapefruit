name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # PyInstaller does NOT cross-compile — the sidecar binary takes the
          # architecture of the runner it's built on. Each macOS arch must use
          # a runner of that arch, or Intel Macs get an arm64 sidecar that
          # can't launch (and vice versa). macos-15-intel is GitHub's last
          # x86_64 image (supported through Aug 2027).
          - platform: macos-15
            rust_target: aarch64-apple-darwin
            sidecar_name: grapefruit-sidecar-aarch64-apple-darwin
          - platform: macos-15-intel
            rust_target: x86_64-apple-darwin
            sidecar_name: grapefruit-sidecar-x86_64-apple-darwin
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            sidecar_name: grapefruit-sidecar-x86_64-pc-windows-msvc.exe
          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            sidecar_name: grapefruit-sidecar-x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          cd python
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python sidecar
        run: |
          cd python
          pyinstaller grapefruit-sidecar.spec --distpath ../src-tauri/binaries/
        shell: bash

      - name: Rename sidecar binary
        run: |
          cd src-tauri/binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv grapefruit-sidecar.exe "${{ matrix.sidecar_name }}"
          else
            mv grapefruit-sidecar "${{ matrix.sidecar_name }}"
            chmod +x "${{ matrix.sidecar_name }}"
          fi
        shell: bash

      - name: Verify sidecar architecture (macOS)
        if: runner.os == 'macOS'
        run: |
          cd src-tauri/binaries
          expected=$(echo "${{ matrix.rust_target }}" | cut -d- -f1)
          [ "$expected" = "aarch64" ] && expected="arm64"
          got=$(lipo -archs "${{ matrix.sidecar_name }}")
          echo "sidecar arch: '$got' (expected '$expected')"
          if [ "$got" != "$expected" ]; then
            echo "::error::Sidecar arch '$got' does not match target '$expected' — Intel/ARM mismatch would ship a sidecar that cannot launch."
            exit 1
          fi
        shell: bash

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build Tauri app
        run: npx tauri build --target ${{ matrix.rust_target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.rust_target }}
          path: |
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.rust_target }}
          path: |
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.rust_target }}
          path: |
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/deb/*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
