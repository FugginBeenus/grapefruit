name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            sidecar_name: grapefruit-sidecar-aarch64-apple-darwin
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            sidecar_name: grapefruit-sidecar-x86_64-apple-darwin
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            sidecar_name: grapefruit-sidecar-x86_64-pc-windows-msvc.exe

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          cd python
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python sidecar
        run: |
          cd python
          pyinstaller grapefruit-sidecar.spec --distpath ../src-tauri/binaries/
        shell: bash

      - name: Rename sidecar binary
        run: |
          cd src-tauri/binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv grapefruit-sidecar.exe "${{ matrix.sidecar_name }}"
          else
            mv grapefruit-sidecar "${{ matrix.sidecar_name }}"
            chmod +x "${{ matrix.sidecar_name }}"
          fi
        shell: bash

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build Tauri app
        run: npx tauri build --target ${{ matrix.rust_target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.rust_target }}
          path: |
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.rust_target }}
          path: |
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
